<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>동작 인식 리듬 퇴치 게임</title>
  <!-- TensorFlow.js 및 Teachable Machine Pose 라이브러리 -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8.3/dist/teachablemachine-pose.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    h1 {
      margin: 10px 0 5px;
      font-size: 28px;
    }
    p.description {
      color: #bbb;
      margin-bottom: 20px;
      font-size: 16px;
    }
    .badge {
      background-color: #333;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 14px;
      border: 1px solid #555;
    }
    #start-btn {
      padding: 12px 28px;
      font-size: 18px;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(135deg, #ff416c, #ff4b2b);
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 75, 43, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
      margin-bottom: 20px;
    }
    #start-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(255, 75, 43, 0.6);
    }
    #game-container {
      position: relative;
      width: 640px;
      height: 480px;
      border: 4px solid #444;
      border-radius: 16px;
      overflow: hidden;
      background-color: #000;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    #webcam-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 640px;
      height: 480px;
      transform: scaleX(-1); /* 거울 모드 */
      opacity: 0.7;
    }
    #game-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 640px;
      height: 480px;
    }
    .target-zone {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 90px;
      height: 90px;
      margin-top: -45px;
      margin-left: -45px;
      border: 3px dashed #ffeb3b;
      border-radius: 50%;
      pointer-events: none;
      animation: pulse 1.5s infinite alternate;
    }
    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.7; }
      100% { transform: scale(1.05); opacity: 1; }
    }
    #info-panel {
      margin-top: 20px;
      display: flex;
      gap: 20px;
      font-size: 18px;
      background: #222;
      padding: 12px 24px;
      border-radius: 12px;
      border: 1px solid #333;
    }
    #info-panel span b {
      color: #ffeb3b;
    }
    #manual-controls {
      margin-top: 15px;
      display: flex;
      gap: 15px;
    }
    .btn-action {
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #444;
      color: white;
      transition: background 0.2s;
    }
    .btn-action:hover {
      background: #666;
    }
  </style>
</head>
<body>

  <h1>🪰 파리 & 🪳 바퀴벌레 퇴치 리듬 게임</h1>
  <p class="description">
    <span class="badge">바퀴벌레 (🪳) ➔ 주먹 [Z키]</span>
    <span class="badge">파리 (🪰) ➔ 박수 [X키]</span>
  </p>
  
  <button id="start-btn" onclick="init()">🎮 게임 시작 (웹캠/동작인식 허용)</button>

  <div id="game-container">
    <canvas id="webcam-canvas"></canvas>
    <canvas id="game-canvas" width="640" height="480"></canvas>
    <div class="target-zone"></div>
  </div>

  <div id="info-panel">
    <span>점수: <b id="score">0</b></span>
    <span>콤보: <b id="combo">0</b></span>
    <span>인식 동작: <b id="detected-action">대기 중</b></span>
  </div>

  <div id="manual-controls">
    <button class="btn-action" onclick="triggerManualAction('주먹')">👊 주먹 테스트 (Z)</button>
    <button class="btn-action" onclick="triggerManualAction('박수')">👏 박수 테스트 (X)</button>
  </div>

  <script>
    const URL = "./my-pose-model/";
    let model, webcam, ctx;
    let maxPredictions;

    let score = 0;
    let combo = 0;
    let currentAction = "None";
    let actionTimer = null;
    let bugs = [];
    let spawnTimer = 0;
    
    const gameCanvas = document.getElementById('game-canvas');
    const gCtx = gameCanvas.getContext('2d');

    // 웹 오디오 API 효과음 생성기
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'hit') {
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
      } else if (type === 'miss') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.2);
      }
    }

    class Bug {
      constructor(type) {
        this.type = type; // 'fly' 또는 'roach'
        const side = Math.floor(Math.random() * 4);
        if (side === 0) { this.x = Math.random() * 640; this.y = -30; }
        else if (side === 1) { this.x = 670; this.y = Math.random() * 480; }
        else if (side === 2) { this.x = Math.random() * 640; this.y = 510; }
        else { this.x = -30; this.y = Math.random() * 480; }

        this.targetX = 320;
        this.targetY = 240;
        this.speed = 2.5 + Math.random() * 1.5;
        this.processed = false;
      }

      update() {
        const angle = Math.atan2(this.targetY - this.y, this.targetX - this.x);
        this.x += Math.cos(angle) * this.speed;
        this.y += Math.sin(angle) * this.speed;
      }

      draw() {
        gCtx.font = "36px Arial";
        gCtx.textAlign = "center";
        gCtx.textBaseline = "middle";
        const emoji = this.type === 'fly' ? '🪰' : '🪳';
        gCtx.fillText(emoji, this.x, this.y);
      }

      isAtCenter() {
        const dist = Math.hypot(this.x - 320, this.y - 240);
        return dist < 45;
      }

      isPastCenter() {
        const dist = Math.hypot(this.x - 320, this.y - 240);
        return dist > 50 && (
          (this.x > 320 && this.targetX === 320) || 
          Math.abs(this.x - 320) < 5
        );
      }
    }

    async function init() {
      document.getElementById('start-btn').style.display = 'none';
      const modelURL = URL + "model.json";
      const metadataURL = URL + "metadata.json";

      try {
        model = await tmPose.load(modelURL, metadataURL);
        maxPredictions = model.getTotalClasses();

        const size = 640;
        const flip = true;
        webcam = new tmPose.Webcam(size, 480, flip);
        await webcam.setup();
        await webcam.play();
        window.requestAnimationFrame(loop);

        const canvas = document.getElementById("webcam-canvas");
        canvas.width = size; 
        canvas.height = 480;
        ctx = canvas.getContext("2d");
      } catch (e) {
        console.warn("웹캠 또는 모델 로드 실패: 수동 조작 모드로 실행됩니다.", e);
      }

      setInterval(gameLoop, 1000 / 60);
    }

    async function loop(timestamp) {
      if (webcam && webcam.canvas) {
        webcam.update();
        await predict();
      }
      window.requestAnimationFrame(loop);
    }

    async function predict() {
      const { pose, posenetOutput } = await model.estimatePose(webcam.canvas);
      const prediction = await model.predict(posenetOutput);

      let highestProb = 0;
      let bestAction = "None";

      for (let i = 0; i < maxPredictions; i++) {
        if (prediction[i].probability > highestProb) {
          highestProb = prediction[i].probability;
          bestAction = prediction[i].className;
        }
      }

      if (highestProb > 0.75) {
        currentAction = bestAction;
      } else {
        currentAction = "None";
      }

      document.getElementById("detected-action").innerText = `${currentAction} (${Math.round(highestProb * 100)}%)`;

      if (webcam.canvas) {
        ctx.drawImage(webcam.canvas, 0, 0);
        if (pose) {
          const minPartConfidence = 0.5;
          tmPose.drawKeypoints(pose.keypoints, minPartConfidence, ctx);
          tmPose.drawSkeleton(pose.keypoints, minPartConfidence, ctx);
        }
      }
    }

    function triggerManualAction(actionName) {
      currentAction = actionName;
      document.getElementById("detected-action").innerText = `${currentAction} (수동 입력)`;
      if (actionTimer) clearTimeout(actionTimer);
      actionTimer = setTimeout(() => {
        currentAction = "None";
        document.getElementById("detected-action").innerText = `대기 중`;
      }, 500);
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'z' || e.key === 'Z' || e.key === 'ㅋ') {
        triggerManualAction('주먹');
      } else if (e.key === 'x' || e.key === 'X' || e.key === 'ㅌ') {
        triggerManualAction('박수');
      }
    });

    function gameLoop() {
      gCtx.clearRect(0, 0, 640, 480);

      spawnTimer++;
      if (spawnTimer % 80 === 0) {
        const type = Math.random() > 0.5 ? 'fly' : 'roach';
        bugs.push(new Bug(type));
      }

      for (let i = bugs.length - 1; i >= 0; i--) {
        let bug = bugs[i];
        bug.update();
        bug.draw();

        const isFist = currentAction.includes("주먹") || currentAction.toLowerCase().includes("fist");
        const isClap = currentAction.includes("박수") || currentAction.toLowerCase().includes("clap");

        if (bug.isAtCenter() && !bug.processed) {
          if ((bug.type === 'roach' && isFist) || (bug.type === 'fly' && isClap)) {
            score += 10 + combo * 2;
            combo++;
            playSound('hit');
            bug.processed = true;
            bugs.splice(i, 1);
          }
        } else {
          const dist = Math.hypot(bug.x - 320, bug.y - 240);
          if (dist > 60 && bug.x > 300 && bug.x < 340 && bug.y > 220 && bug.y < 260) {
            combo = 0;
            playSound('miss');
            bugs.splice(i, 1);
          }
        }
      }

      document.getElementById("score").innerText = score;
      document.getElementById("combo").innerText = combo;
    }
  </script>
</body>
</html>
